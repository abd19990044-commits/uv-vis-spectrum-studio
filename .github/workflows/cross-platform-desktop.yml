name: Cross-platform Desktop Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "app.py"
      - "desktop_launcher.py"
      - "uvvis_studio/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".streamlit/**"
      - "README.md"
      - "LICENSE"
      - "LICENSE-NOTICE.md"
      - "CITATION.cff"
      - ".zenodo.json"
      - "codemeta.json"
      - "CHANGELOG.md"
      - "tests/**"
      - ".github/workflows/cross-platform-desktop.yml"

permissions:
  contents: write

concurrency:
  group: cross-platform-v3-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  RELEASE_VERSION: "3.1.0"

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch_label: x86_64
            bundle_chrome: true
          - runner: ubuntu-24.04-arm
            arch_label: arm64
            bundle_chrome: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install system runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 xvfb
          if apt-cache show libwebkit2gtk-4.1-0 >/dev/null 2>&1; then
            sudo apt-get install -y libwebkit2gtk-4.1-0
          else
            sudo apt-get install -y libwebkit2gtk-4.0-37
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pytest
          pip check

      - name: Verify release version and run tests
        shell: bash
        run: |
          VERSION=$(python -c "import uvvis_studio; print(uvvis_studio.__version__)")
          test "$VERSION" = "$RELEASE_VERSION"
          TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TOML_VERSION" = "$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$VERSION"
          fi
          pytest -q
          python -m compileall app.py desktop_launcher.py uvvis_studio

      - name: Embed build provenance
        shell: bash
        run: |
          BUILD_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > uvvis_studio/build_info.py <<EOF
          """Build-time provenance generated by GitHub Actions."""
          GIT_COMMIT = "${GITHUB_SHA}"
          BUILD_UTC = "${BUILD_UTC}"
          EOF
          python -m py_compile uvvis_studio/build_info.py

      - name: Bundle Chrome for Kaleido export on x86_64
        if: matrix.bundle_chrome
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import kaleido, shutil
          browser = Path(kaleido.get_chrome_sync()).resolve()
          root = Path("vendor/chrome")
          root.mkdir(parents=True, exist_ok=True)
          for item in browser.parent.iterdir():
              target = root / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)
          if not any(p.name == "chrome" for p in root.rglob("chrome")):
              raise SystemExit("Bundled Chrome executable was not found")
          PY

      - name: Note Linux ARM64 export browser requirement
        if: ${{ !matrix.bundle_chrome }}
        shell: bash
        run: |
          echo "Chrome-for-Testing has no linux-arm64 download through Kaleido."
          echo "The ARM64 desktop build remains functional; publication raster/vector export uses a system Chrome/Chromium via BROWSER_PATH."

      - name: Build Linux desktop bundle
        shell: bash
        run: |
          EXTRA_DATA=()
          if [ -d vendor/chrome ]; then
            EXTRA_DATA+=(--add-data "vendor/chrome:vendor/chrome")
          fi
          pyinstaller --noconfirm --clean --onedir \
            --name "UV-Vis Spectrum Studio" \
            --add-data "app.py:." \
            --add-data ".streamlit:.streamlit" \
            --add-data "uvvis_studio:uvvis_studio" \
            "${EXTRA_DATA[@]}" \
            --collect-all streamlit \
            --collect-all plotly \
            --collect-all pywt \
            --hidden-import kaleido \
            --collect-data kaleido \
            --hidden-import choreographer \
            --collect-data choreographer \
            --collect-submodules uvvis_studio \
            desktop_launcher.py

      - name: Packaged self-test
        shell: bash
        run: |
          marker="$RUNNER_TEMP/uvvis-self-test.ok"
          export UVVIS_SELF_TEST_MARKER="$marker"
          timeout 120 "dist/UV-Vis Spectrum Studio/UV-Vis Spectrum Studio" --uvvis-self-test
          test -f "$marker"
          grep -q ':modules' "$marker"
          cat "$marker"

      - name: Create Linux release bundle
        shell: bash
        run: |
          mkdir -p release staging
          cp -R "dist/UV-Vis Spectrum Studio" staging/
          cp README.md LICENSE LICENSE-NOTICE.md CITATION.cff CHANGELOG.md staging/
          OUT="$PWD/release/UVVis_Spectrum_Studio_v${RELEASE_VERSION}_Linux_${{ matrix.arch_label }}.tar.gz"
          tar -C staging -czf "$OUT" .
          pip freeze | sort > "release/requirements-lock-Linux-${{ matrix.arch_label }}.txt"
          cat > "release/BUILD-INFO-Linux-${{ matrix.arch_label }}.txt" <<EOF
          UV-Vis Spectrum Studio ${RELEASE_VERSION}
          Git commit: ${GITHUB_SHA}
          Git ref: ${GITHUB_REF}
          Runner: ${{ matrix.runner }}
          Runner OS: ${RUNNER_OS}
          Architecture: ${{ matrix.arch_label }}
          Python: $(python --version 2>&1)
          Bundled Chrome-for-Testing: ${{ matrix.bundle_chrome }}
          EOF
          (cd release && sha256sum UVVis_* requirements-lock-* BUILD-INFO-* > "SHA256SUMS-Linux-${{ matrix.arch_label }}.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: UVVis-Spectrum-Studio-Linux-${{ matrix.arch_label }}-v3.1.0
          path: release/*
          retention-days: 30

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch_label: x86_64
          - runner: macos-15
            arch_label: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pytest
          pip check

      - name: Verify release version and run tests
        shell: bash
        run: |
          VERSION=$(python -c "import uvvis_studio; print(uvvis_studio.__version__)")
          test "$VERSION" = "$RELEASE_VERSION"
          TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TOML_VERSION" = "$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$VERSION"
          fi
          pytest -q
          python -m compileall app.py desktop_launcher.py uvvis_studio

      - name: Embed build provenance
        shell: bash
        run: |
          BUILD_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > uvvis_studio/build_info.py <<EOF
          """Build-time provenance generated by GitHub Actions."""
          GIT_COMMIT = "${GITHUB_SHA}"
          BUILD_UTC = "${BUILD_UTC}"
          EOF
          python -m py_compile uvvis_studio/build_info.py

      - name: Package Chrome as opaque archive for Kaleido
        shell: bash
        run: |
          BROWSER=$(python -c "import kaleido; print(kaleido.get_chrome_sync())")
          APP=$(python - "$BROWSER" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1]).resolve()
          app = next((parent for parent in p.parents if parent.suffix == '.app'), None)
          print(app or '')
          PY
          )
          mkdir -p vendor/chrome
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP" vendor/chrome/chrome-macos.zip
          else
            BROWSER_DIR=$(dirname "$BROWSER")
            ditto -c -k --sequesterRsrc --keepParent "$BROWSER_DIR" vendor/chrome/chrome-macos.zip
          fi
          test -s vendor/chrome/chrome-macos.zip

      - name: Build macOS application
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir \
            --name "UV-Vis Spectrum Studio" \
            --osx-bundle-identifier "io.github.abd19990044.uvvis-spectrum-studio" \
            --add-data "app.py:." \
            --add-data ".streamlit:.streamlit" \
            --add-data "uvvis_studio:uvvis_studio" \
            --add-data "vendor/chrome:vendor/chrome" \
            --collect-all streamlit \
            --collect-all plotly \
            --collect-all pywt \
            --hidden-import kaleido \
            --collect-data kaleido \
            --hidden-import choreographer \
            --collect-data choreographer \
            --collect-submodules uvvis_studio \
            desktop_launcher.py

      - name: Apply ad-hoc signature to macOS app
        shell: bash
        run: |
          if [ -d "dist/UV-Vis Spectrum Studio.app" ]; then
            codesign --force --deep --sign - "dist/UV-Vis Spectrum Studio.app"
            codesign --verify --deep --strict "dist/UV-Vis Spectrum Studio.app"
          fi

      - name: Packaged self-test
        shell: bash
        run: |
          marker="$RUNNER_TEMP/uvvis-self-test.ok"
          export UVVIS_SELF_TEST_MARKER="$marker"
          EXE="dist/UV-Vis Spectrum Studio.app/Contents/MacOS/UV-Vis Spectrum Studio"
          if [ ! -x "$EXE" ]; then
            EXE="dist/UV-Vis Spectrum Studio/UV-Vis Spectrum Studio"
          fi
          "$EXE" --uvvis-self-test
          test -f "$marker"
          grep -q ':modules' "$marker"
          cat "$marker"

      - name: Create macOS ZIP and DMG
        shell: bash
        run: |
          mkdir -p release dmg-root
          if [ -d "dist/UV-Vis Spectrum Studio.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/UV-Vis Spectrum Studio.app" "release/UVVis_Spectrum_Studio_v${RELEASE_VERSION}_macOS_${{ matrix.arch_label }}.zip"
            cp -R "dist/UV-Vis Spectrum Studio.app" dmg-root/
            ln -s /Applications dmg-root/Applications
            hdiutil create -volname "UV-Vis Spectrum Studio" -srcfolder dmg-root -ov -format UDZO "release/UVVis_Spectrum_Studio_v${RELEASE_VERSION}_macOS_${{ matrix.arch_label }}.dmg"
          else
            ditto -c -k --sequesterRsrc --keepParent "dist/UV-Vis Spectrum Studio" "release/UVVis_Spectrum_Studio_v${RELEASE_VERSION}_macOS_${{ matrix.arch_label }}.zip"
          fi
          pip freeze | sort > "release/requirements-lock-macOS-${{ matrix.arch_label }}.txt"
          cat > "release/BUILD-INFO-macOS-${{ matrix.arch_label }}.txt" <<EOF
          UV-Vis Spectrum Studio ${RELEASE_VERSION}
          Git commit: ${GITHUB_SHA}
          Git ref: ${GITHUB_REF}
          Runner: ${{ matrix.runner }}
          Runner OS: ${RUNNER_OS}
          Architecture: ${{ matrix.arch_label }}
          Python: $(python --version 2>&1)
          Application signature: ad-hoc
          Apple Developer ID notarization: not configured
          EOF
          (cd release && shasum -a 256 UVVis_* requirements-lock-* BUILD-INFO-* > "SHA256SUMS-macOS-${{ matrix.arch_label }}.txt")

      - uses: actions/upload-artifact@v4
        with:
          name: UVVis-Spectrum-Studio-macOS-${{ matrix.arch_label }}-v3.1.0
          path: release/*
          retention-days: 30

  upload-tagged-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload cross-platform assets to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --target "$GITHUB_SHA" --title "UV-Vis Spectrum Studio $GITHUB_REF_NAME" --notes "Draft scientific software release. Publish only after all platform builds and release QA complete. Publishing is the Zenodo archival gate." || true
          fi
          for attempt in {1..10}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then break; fi
            sleep 3
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null
          while IFS= read -r file; do
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          done < <(find artifacts -type f)
