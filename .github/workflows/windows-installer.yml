name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "app.py"
      - "desktop_launcher.py"
      - "uvvis_studio/**"
      - "requirements-desktop.txt"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "LICENSE-NOTICE.md"
      - "CITATION.cff"
      - ".zenodo.json"
      - "CHANGELOG.md"
      - "build_assets/**"
      - "installer/**"
      - ".streamlit/**"
      - "tests/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: write

concurrency:
  group: windows-v3-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  RELEASE_VERSION: "3.1.0"

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 70
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pytest
          pip check

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (python -c "import uvvis_studio; print(uvvis_studio.__version__)").Trim()
          $tomlVersion = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($version -ne $env:RELEASE_VERSION) { throw "Package version mismatch: expected $env:RELEASE_VERSION, got $version" }
          if ($tomlVersion -ne $version) { throw "pyproject/package mismatch: $tomlVersion vs $version" }
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tagVersion = "${{ github.ref_name }}".TrimStart('v')
            if ($tagVersion -ne $version) { throw "Tag/package mismatch: tag $tagVersion, package $version" }
          }

      - name: Embed build provenance and freeze environment
        shell: pwsh
        run: |
          $utc = (Get-Date).ToUniversalTime().ToString("o")
          $lines = @(
            '"""Build-time provenance generated by GitHub Actions."""',
            '',
            'GIT_COMMIT = "${{ github.sha }}"',
            "BUILD_UTC = `"$utc`""
          )
          $lines | Set-Content -Path "uvvis_studio/build_info.py" -Encoding UTF8
          python -m py_compile uvvis_studio/build_info.py
          python -m pip freeze | Sort-Object | Set-Content -Path "build_assets/requirements-lock-v3.1.0.txt" -Encoding UTF8

      - name: Run scientific tests
        shell: pwsh
        run: |
          pytest -q
          python -m compileall app.py desktop_launcher.py uvvis_studio

      - name: Create application icon
        shell: pwsh
        run: python build_assets/make_icon.py

      - name: Bundle Chrome for offline scientific export
        shell: pwsh
        run: |
          $chromePath = (python -c "import kaleido; print(kaleido.get_chrome_sync())").Trim()
          if (!(Test-Path $chromePath)) { throw "Kaleido Chrome download failed: $chromePath" }
          New-Item -ItemType Directory -Force -Path "vendor/chrome" | Out-Null
          $chromeDir = Split-Path -Parent $chromePath
          Copy-Item -Path "$chromeDir/*" -Destination "vendor/chrome" -Recurse -Force
          if (!(Test-Path "vendor/chrome/chrome.exe")) { throw "Bundled chrome.exe was not found." }

      - name: Build desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "UV-Vis Spectrum Studio" `
            --icon "build_assets/app.ico" `
            --add-data "app.py;." `
            --add-data ".streamlit;.streamlit" `
            --add-data "uvvis_studio;uvvis_studio" `
            --add-data "vendor/chrome;vendor/chrome" `
            --collect-all streamlit `
            --collect-all plotly `
            --collect-all pywt `
            --hidden-import kaleido `
            --collect-data kaleido `
            --hidden-import choreographer `
            --collect-data choreographer `
            --collect-submodules uvvis_studio `
            desktop_launcher.py

      - name: Prepare code-signing certificate
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            $pfx = Join-Path $env:RUNNER_TEMP "uvvis-codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation "Cert:\CurrentUser\My" -Password $password
            if ($null -eq $cert) { throw "Trusted code-signing certificate could not be imported." }
            "SIGNING_MODE=trusted" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=ABDULSALAM S. HASAN" `
              -FriendlyName "ABDULSALAM S. HASAN - UV-Vis Spectrum Studio" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyAlgorithm RSA `
              -KeyLength 3072 `
              -HashAlgorithm SHA256 `
              -KeyExportPolicy Exportable `
              -NotAfter (Get-Date).AddYears(3)
            Export-Certificate -Cert $cert -FilePath "build_assets/ABDULSALAM_S_HASAN_CodeSigning.cer" | Out-Null
            "SIGNING_MODE=self-signed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          "SIGNING_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign desktop executable
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:SIGNING_CERT_THUMBPRINT"
          $exe = "dist/UV-Vis Spectrum Studio/UV-Vis Spectrum Studio.exe"
          if (!(Test-Path $exe)) { throw "Desktop executable was not created." }
          if ($env:SIGNING_MODE -eq "trusted") {
            Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" | Out-Null
          } else {
            Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256 | Out-Null
          }
          if ($null -eq (Get-AuthenticodeSignature $exe).SignerCertificate) { throw "Desktop executable was not signed." }

      - name: Run packaged server self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/UV-Vis Spectrum Studio/UV-Vis Spectrum Studio.exe").Path
          $marker = Join-Path $env:RUNNER_TEMP "uvvis-self-test.ok"
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          $env:UVVIS_SELF_TEST_MARKER = $marker
          $process = Start-Process -FilePath $exe -ArgumentList "--uvvis-self-test" -PassThru -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(120)
          $passed = $false
          while ((Get-Date) -lt $deadline) {
            if (Test-Path $marker) {
              $markerText = Get-Content $marker -Raw
              Write-Host "Packaged server self-test marker: $markerText"
              if ($markerText -notmatch ":modules") { throw "Project-module import verification did not run." }
              $passed = $true
              break
            }
            if ($process.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          Get-Process -Name "UV-Vis Spectrum Studio" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $passed) {
            $log = Join-Path $env:LOCALAPPDATA "UVVisSpectrumStudio\logs\startup.log"
            if (Test-Path $log) { Get-Content $log -Tail 250 }
            throw "The packaged UV-Vis server did not reach a ready state with v3.1 modules loaded."
          }

      - name: Create portable Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "portable/UV-Vis Spectrum Studio" | Out-Null
          Copy-Item -Path "dist/UV-Vis Spectrum Studio/*" -Destination "portable/UV-Vis Spectrum Studio" -Recurse -Force
          Copy-Item README.md,LICENSE,LICENSE-NOTICE.md,CITATION.cff,CHANGELOG.md -Destination "portable" -Force
          New-Item -ItemType Directory -Force -Path "installer_output" | Out-Null
          $zip = "installer_output/UVVis_Spectrum_Studio_v3.1.0_Windows_x64_Portable.zip"
          Compress-Archive -Path "portable/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content "$zip.sha256"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer EXE
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\uvvis_studio.iss"
          if (!(Test-Path "installer_output/UVVis_Spectrum_Studio_Setup.exe")) { throw "Installer was not created." }

      - name: Sign installer and generate checksum
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:SIGNING_CERT_THUMBPRINT"
          $installer = "installer_output/UVVis_Spectrum_Studio_Setup.exe"
          if ($env:SIGNING_MODE -eq "trusted") {
            Set-AuthenticodeSignature -FilePath $installer -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" | Out-Null
          } else {
            Set-AuthenticodeSignature -FilePath $installer -Certificate $cert -HashAlgorithm SHA256 | Out-Null
          }
          if ($null -eq (Get-AuthenticodeSignature $installer).SignerCertificate) { throw "Installer was not signed." }
          (Get-FileHash $installer -Algorithm SHA256).Hash | Set-Content "installer_output/UVVis_Spectrum_Studio_Setup.sha256"
          @"
          UV-Vis Spectrum Studio 3.1.0
          Git commit: ${{ github.sha }}
          Git ref: ${{ github.ref }}
          Runner OS: $env:RUNNER_OS
          Architecture: x64-compatible
          Python: $(python --version)
          Signing mode: $env:SIGNING_MODE
          "@ | Set-Content "installer_output/BUILD-INFO-Windows-x64.txt" -Encoding UTF8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UVVis-Spectrum-Studio-Windows-v3.1.0
          path: |
            installer_output/UVVis_Spectrum_Studio_Setup.exe
            installer_output/UVVis_Spectrum_Studio_Setup.sha256
            installer_output/UVVis_Spectrum_Studio_v3.1.0_Windows_x64_Portable.zip
            installer_output/UVVis_Spectrum_Studio_v3.1.0_Windows_x64_Portable.zip.sha256
            installer_output/BUILD-INFO-Windows-x64.txt
            build_assets/ABDULSALAM_S_HASAN_CodeSigning.cer
            build_assets/requirements-lock-v3.1.0.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows assets to draft tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target "${{ github.sha }}" --title "UV-Vis Spectrum Studio $tag" --notes "Draft scientific software release. Publish only after all platform builds, checksums, metadata, and release QA are complete. Publishing the release is the Zenodo archival gate."
          }
          Get-ChildItem "installer_output/*" -File | ForEach-Object { gh release upload $tag $_.FullName --clobber }
          gh release upload $tag "build_assets/requirements-lock-v3.1.0.txt" --clobber
          if (Test-Path "build_assets/ABDULSALAM_S_HASAN_CodeSigning.cer") {
            gh release upload $tag "build_assets/ABDULSALAM_S_HASAN_CodeSigning.cer" --clobber
          }
