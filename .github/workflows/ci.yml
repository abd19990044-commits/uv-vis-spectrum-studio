name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Check dependency consistency
        run: pip check
      - name: Validate release metadata
        run: python tools/validate_release_metadata.py
      - name: Run scientific and regression tests
        run: pytest -q
      - name: Compile application modules
        run: python -m compileall app.py desktop_launcher.py uvvis_studio tools/validate_release_metadata.py
