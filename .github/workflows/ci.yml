name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - name: Check dependency consistency
        run: pip check
      - name: Validate release metadata
        run: python tools/validate_release_metadata.py
      - name: Run scientific and regression tests
        run: pytest -q
      - name: Compile application modules
        run: python -m compileall app.py desktop_launcher.py uvvis_studio tools/validate_release_metadata.py

  installed-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install build twine pip-audit playwright==1.51.0
          python -m build
          python -m twine check dist/*
          python -m pip install -c requirements-tested-linux-py312.txt dist/*.whl
          python -m pip check
          python -m pip_audit -r requirements-tested-linux-py312.txt --no-deps --disable-pip
          python -m playwright install --with-deps chromium
      - name: Exercise installed CLI, export and project round trip
        run: python tools/production_browser_check.py --installed --output "$RUNNER_TEMP/uvvis-browser-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-browser-evidence
          path: ${{ runner.temp }}/uvvis-browser-evidence
