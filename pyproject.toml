[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uvvis-spectrum-studio"
version = "3.1.0"
description = "Open-source UV-Vis spectroscopy analysis, validation, chemometrics, deconvolution, and reproducible scientific workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Abdulsalam S. Hasan" }
]
dependencies = [
  "streamlit>=1.50,<2",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "PyWavelets>=1.7,<2",
  "plotly>=6.0,<7",
  "openpyxl>=3.1,<4",
  "kaleido>=1.0,<2",
  "Pillow>=11,<12",
  "xlrd>=2.0,<3"
]
keywords = [
  "UV-Vis spectroscopy",
  "analytical chemistry",
  "spectrophotometry",
  "chemometrics",
  "method validation",
  "spectral analysis",
  "scientific software",
  "reproducible research"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry"
]

[project.scripts]
uvvis-spectrum-studio = "uvvis_studio.cli:main"

[project.urls]
Homepage = "https://github.com/abd19990044-commits/uv-vis-spectrum-studio"
Repository = "https://github.com/abd19990044-commits/uv-vis-spectrum-studio"
Issues = "https://github.com/abd19990044-commits/uv-vis-spectrum-studio/issues"
Changelog = "https://github.com/abd19990044-commits/uv-vis-spectrum-studio/blob/main/CHANGELOG.md"
Documentation = "https://github.com/abd19990044-commits/uv-vis-spectrum-studio#readme"

[tool.setuptools.packages.find]
include = ["uvvis_studio*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
